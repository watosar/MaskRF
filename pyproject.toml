[project]
name = "maskrf"
version = "0.1.0"
description = "RF S-parameter simulation from binary metal masks with openEMS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "matplotlib==3.9.4",
    "scipy==1.13.1",
    "h5py",
    "pyyaml",
    "pillow",
]

[project.scripts]
maskrf = "maskrf.__main__:main"

[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maskrf = ["configs/*.yaml", "data/*.csv"]

[tool.setuptools.data-files]
"share/maskrf/scripts" = [
    "scripts/bootstrap.sh",
    "scripts/build_native.sh",
    "scripts/build_bindings.sh",
    "scripts/paths.sh",
    "scripts/repair_library_links.py",
    "scripts/requirements-native.txt",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
cache-dir = "tmp/ruff-cache"
include = ["*.py", "*.pyi"]
extend-exclude = ["tmp"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
